# Builds Umoria for the Asciiverse catalog: one archive per target,
# umoria-<target>.tar.gz (.zip on Windows), plus SHA256SUMS, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Runs
# on a pushed tag, or by hand for an existing tag.
#
# Linux builds run in Alpine and link ncurses and libstdc++ statically, so
# the binaries carry the -musl triple av looks for first and need nothing
# on the player's machine. macOS links the system ncurses, which every Mac
# has. Windows is cross-built with MinGW against PDCurses (wincon).

name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PDCURSES_VERSION: "3.9"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # mounted at /work: upstream's CMakeLists.txt refuses a source folder
      # named /src
      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.22 sh -c '
            apk add --no-cache build-base cmake ncurses-dev ncurses-static &&
            CURSES_LIB=/usr/lib/libncursesw.a LDFLAGS="-static -s" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/umoria

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CXXFLAGS="-arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" asciiverse/build.sh
          strip out/umoria
          file out/umoria
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build PDCurses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix zip
          curl -sL "https://github.com/wmcbrine/PDCurses/archive/refs/tags/$PDCURSES_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION/wincon" CC=$CROSS-gcc-posix AR=$CROSS-ar pdcurses.a

      - name: Build and package
        run: |
          CXX=$CROSS-g++-posix PDCURSES="$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION" LDFLAGS=-s asciiverse/build.sh
          file out/umoria.exe
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Umoria $TAG" \
                 --notes "Umoria $TAG, Robert A. Koeneke's and James E. Wilson's Moria, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
